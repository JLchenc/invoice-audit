services:
  pg:
    image: pgvector/pgvector:pg16
    container_name: invoice-pg
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice_dev
      POSTGRES_DB: invoice_audit
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice_audit"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: invoice-redis
    ports: ["6380:6379"] # 宿主机 6379 已被本地 redis 占用，容器对外用 6380
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  pgdata:
